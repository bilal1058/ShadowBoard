name: ShadowBoard AI Assurance CI/CD Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ai-security-assurance:
    name: Autonomous AI Agent Security Assessment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ShadowBoard Security Gate
        run: |
          python backend/shadowboard_cli.py \
            --target-id 2 \
            --ci \
            --max-critical 0 \
            --min-score 75 \
            --sarif-out shadowboard-results.sarif \
            --junit-out junit-report.xml

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shadowboard-results.sarif
          category: shadowboard-ai-assurance
