version: '3.8'

services:
  shadowboard-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadowboard-platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/shadowboard.db:/app/backend/shadowboard.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/targets"]
      interval: 10s
      timeout: 5s
      retries: 3
